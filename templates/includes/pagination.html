{% if newer_cursor or older_cursor %}
    <nav aria-label="History pagination">
        <p><small>Newest changes first.</small></p>
        <ul>
            <li>
                {% if newer_cursor %}
                    <a href="{{ history_base_url }}{{ page_join }}newer={{ newer_cursor|urlencode }}">&larr; Newer</a>
                {% else %}
                    &larr; Newer
                {% endif %}
            </li>
            <li>
                {% if older_cursor %}
                    <a href="{{ history_base_url }}{{ page_join }}older={{ older_cursor|urlencode }}">Older &rarr;</a>
                {% else %}
                    Older &rarr;
                {% endif %}
            </li>
        </ul>
    </nav>
{% endif %}

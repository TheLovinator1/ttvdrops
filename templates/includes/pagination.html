{% if newer_cursor or older_cursor %}
    <nav class="pagination" aria-label="Pagination">
        {% if newer_cursor %}
            <a href="{{ history_base_url }}{{ page_join }}newer={{ newer_cursor|urlencode }}">[newer]</a>
        {% else %}
            <span>[newer]</span>
        {% endif %}
        {% if older_cursor %}
            <a href="{{ history_base_url }}{{ page_join }}older={{ older_cursor|urlencode }}">[older]</a>
        {% else %}
            <span>[older]</span>
        {% endif %}
        <span class="history-muted">Newest first</span>
    </nav>
{% endif %}

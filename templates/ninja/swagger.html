{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link type="text/css"
              rel="stylesheet"
              href="{% static 'ninja/swagger-ui.css' %}" />
        {% include "ninja/favicons.html" %}
        <title>TTVDrops API v1 Documentation - Twitch and Kick Drops API</title>
        <meta name="description"
              content="Interactive documentation for the TTVDrops API v1. Browse endpoints for Twitch and Kick drop campaigns, games, rewards, organizations and channels. No authentication required." />
        <meta name="robots" content="index, follow" />
        <meta property="og:title"
              content="TTVDrops API v1 Documentation - Twitch and Kick Drops API" />
        <meta property="og:description"
              content="Interactive documentation for the TTVDrops API v1. Browse endpoints for Twitch and Kick drop campaigns, games, rewards, organizations and channels." />
        <meta property="og:type" content="website" />
        <meta property="og:url"
              content="{{ BASE_URL }}/api/v1/docs/" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title"
              content="TTVDrops API v1 Documentation - Twitch and Kick Drops API" />
        <meta name="twitter:description"
              content="Interactive documentation for the TTVDrops API v1. Browse endpoints for Twitch and Kick drop campaigns, games, rewards, organizations and channels." />
        <link rel="canonical"
              href="{{ BASE_URL }}/api/v1/docs/" />
    </head>
    <body data-csrf-token="{% if add_csrf %}{{ csrf_token }}{% endif %}"
          data-api-csrf="{% if add_csrf %}true{% endif %}">
        <script type="application/json" id="swagger-settings">{{ swagger_settings | safe }}</script>

        <div id="swagger-ui"></div>

        <script src="{% static 'ninja/swagger-ui-bundle.js' %}"></script>
        <script src="{% static 'ninja/swagger-ui-init.js' %}"></script>
    </body>
</html>

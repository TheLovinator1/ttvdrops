{% if external_site_links %}
    <p>
        <small>Also on:</small>
        {% for link in external_site_links %}
            <a href="{{ link.url }}"
               target="_blank"
               rel="noopener"
               referrerpolicy="origin"
               title="View on {{ link.name }}">{{ link.name }}</a>{% if not forloop.last %} |{% endif %}
        {% endfor %}
    </p>
{% endif %}

<dl>
    {% for change in changes %}
        <dt>{{ change.field }}</dt>
        <dd>
            <del>{% if change.old.image_url %}<a href="{{ change.old.image_url }}" target="_blank" rel="noopener"><img src="{{ change.old.image_url }}" alt="" width="120" loading="lazy" /></a>{% endif %}{{ change.old.text }}</del>
            &rarr;
            <ins>{% if change.new.image_url %}<a href="{{ change.new.image_url }}" target="_blank" rel="noopener"><img src="{{ change.new.image_url }}" alt="" width="120" loading="lazy" /></a>{% endif %}{{ change.new.text }}</ins>
        </dd>
    {% endfor %}
</dl>

{% extends "base.html" %}
{% block title %}
    Games
{% endblock title %}
{% block content %}
    <h1>Organizations</h1>
    {% if orgs %}
        <ul>
            {% for organization in orgs %}
                <li>
                    <a href="{% url 'twitch:org_detail' organization.id %}">{{ organization.name }}</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        No games found.
    {% endif %}
{% endblock content %}

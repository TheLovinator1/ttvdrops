name: Test and Build Docker Image

on:
  push:
  pull_request:
  schedule:
    - cron: "0 14 * * *" # Run every day at 14:00 CET
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: 1234567890
      DJANGO_DEBUG: False
      POSTGRES_DB: ttvdrops_test
      POSTGRES_USER: ttvdrops_test
      POSTGRES_PASSWORD: testpass123
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ttvdrops_test
          POSTGRES_USER: ttvdrops_test
          POSTGRES_PASSWORD: testpass123
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: thelovinator1
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - uses: actions/checkout@v6

      - uses: astral-sh/ruff-action@v3
        with:
          version: "latest"
      - run: ruff check --exit-non-zero-on-fix --verbose
      - run: ruff format --check --verbose

      - run: docker build --check .
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras --dev
      - run: uv run pytest

      - run: uv run python manage.py makemigrations --check
      - run: uv run python manage.py migrate
      - run: uv run python manage.py collectstatic --noinput
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/thelovinator1/ttvdrops
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}

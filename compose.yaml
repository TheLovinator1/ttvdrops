name: ttvdrops

services:
  db:
    image: postgres:18-trixie
    environment:
      POSTGRES_DB: ttvdrops
      POSTGRES_USER: ttvdrops
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      # PostgreSQL 18 uses PGDATA=/var/lib/postgresql/18/docker, so mount the parent.
      - /mnt/Docker/Data/ttvdrops/postgres:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9-trixie
    volumes:
      - /mnt/Docker/Data/ttvdrops/valkey:/data
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # One-shot container: migrations + static files before any worker starts.
  init:
    image: git.lovinator.space/thelovinator/ttvdrops:latest
    user: "1001:1002"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Gunicorn 27 keeps its control socket in $HOME/.gunicorn; the numeric
      # container user has no passwd entry, so HOME would otherwise be /.
      HOME: /tmp
      USE_SQLITE: "False"
      POSTGRES_DB: ttvdrops
      POSTGRES_USER: ttvdrops
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL_CACHE: redis://valkey:6379/0
      REDIS_URL_CELERY: redis://valkey:6379/1
      # platformdirs puts media/, staticfiles/ and datasets/ under $XDG_DATA_HOME/TTVDrops.
      XDG_DATA_HOME: /app/data
      TTVDROPS_PENDING_DIR: /srv/ttvdrops/responses/pending
      TTVDROPS_IMPORTED_DIR: /srv/ttvdrops/responses/imported
      TTVDROPS_BROKEN_DIR: /srv/ttvdrops/responses/broken
    volumes:
      - /mnt/Docker/Data/ttvdrops/app:/app/data/TTVDrops
      - /mnt/fourteen/Data/Responses:/srv/ttvdrops/responses
    command: [ "sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput" ]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  web:
    image: git.lovinator.space/thelovinator/ttvdrops:latest
    user: "1001:1002"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Gunicorn 27 keeps its control socket in $HOME/.gunicorn; the numeric
      # container user has no passwd entry, so HOME would otherwise be /.
      HOME: /tmp
      USE_SQLITE: "False"
      POSTGRES_DB: ttvdrops
      POSTGRES_USER: ttvdrops
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL_CACHE: redis://valkey:6379/0
      REDIS_URL_CELERY: redis://valkey:6379/1
      # platformdirs puts media/, staticfiles/ and datasets/ under $XDG_DATA_HOME/TTVDrops.
      XDG_DATA_HOME: /app/data
      TTVDROPS_PENDING_DIR: /srv/ttvdrops/responses/pending
      TTVDROPS_IMPORTED_DIR: /srv/ttvdrops/responses/imported
      TTVDROPS_BROKEN_DIR: /srv/ttvdrops/responses/broken
    volumes:
      - /mnt/Docker/Data/ttvdrops/app:/app/data/TTVDrops
      - /mnt/fourteen/Data/Responses:/srv/ttvdrops/responses
    command:
      - sh
      - -c
      - >-
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --name ttvdrops --max-requests 1200 --max-requests-jitter 50 --access-logfile - --error-logfile - --no-control-socket
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # TCP check only: with DEBUG=False Django rejects requests to 127.0.0.1
      # (ALLOWED_HOSTS is fixed to the production domain).
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery-worker:
    image: git.lovinator.space/thelovinator/ttvdrops:latest
    user: "1001:1002"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Gunicorn 27 keeps its control socket in $HOME/.gunicorn; the numeric
      # container user has no passwd entry, so HOME would otherwise be /.
      HOME: /tmp
      USE_SQLITE: "False"
      POSTGRES_DB: ttvdrops
      POSTGRES_USER: ttvdrops
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL_CACHE: redis://valkey:6379/0
      REDIS_URL_CELERY: redis://valkey:6379/1
      # platformdirs puts media/, staticfiles/ and datasets/ under $XDG_DATA_HOME/TTVDrops.
      XDG_DATA_HOME: /app/data
      TTVDROPS_PENDING_DIR: /srv/ttvdrops/responses/pending
      TTVDROPS_IMPORTED_DIR: /srv/ttvdrops/responses/imported
      TTVDROPS_BROKEN_DIR: /srv/ttvdrops/responses/broken
    volumes:
      - /mnt/Docker/Data/ttvdrops/app:/app/data/TTVDrops
      - /mnt/fourteen/Data/Responses:/srv/ttvdrops/responses
    command:
      - sh
      - -c
      - >-
        celery -A config worker --queues imports,api-fetches,image-downloads,default --concurrency 4 --loglevel INFO
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  celery-beat:
    image: git.lovinator.space/thelovinator/ttvdrops:latest
    user: "1001:1002"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Gunicorn 27 keeps its control socket in $HOME/.gunicorn; the numeric
      # container user has no passwd entry, so HOME would otherwise be /.
      HOME: /tmp
      USE_SQLITE: "False"
      POSTGRES_DB: ttvdrops
      POSTGRES_USER: ttvdrops
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL_CACHE: redis://valkey:6379/0
      REDIS_URL_CELERY: redis://valkey:6379/1
      # platformdirs puts media/, staticfiles/ and datasets/ under $XDG_DATA_HOME/TTVDrops.
      XDG_DATA_HOME: /app/data
      TTVDROPS_PENDING_DIR: /srv/ttvdrops/responses/pending
      TTVDROPS_IMPORTED_DIR: /srv/ttvdrops/responses/imported
      TTVDROPS_BROKEN_DIR: /srv/ttvdrops/responses/broken
    volumes:
      - /mnt/Docker/Data/ttvdrops/app:/app/data/TTVDrops
      - /mnt/fourteen/Data/Responses:/srv/ttvdrops/responses
    command:
      - celery
      - -A
      - config
      - beat
      - --scheduler
      - django_celery_beat.schedulers:DatabaseScheduler
      - --loglevel
      - INFO
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Optional: docker compose --profile monitoring up -d
  flower:
    image: git.lovinator.space/thelovinator/ttvdrops:latest
    user: "1001:1002"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Gunicorn 27 keeps its control socket in $HOME/.gunicorn; the numeric
      # container user has no passwd entry, so HOME would otherwise be /.
      HOME: /tmp
      USE_SQLITE: "False"
      POSTGRES_DB: ttvdrops
      POSTGRES_USER: ttvdrops
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL_CACHE: redis://valkey:6379/0
      REDIS_URL_CELERY: redis://valkey:6379/1
      # platformdirs puts media/, staticfiles/ and datasets/ under $XDG_DATA_HOME/TTVDrops.
      XDG_DATA_HOME: /app/data
      TTVDROPS_PENDING_DIR: /srv/ttvdrops/responses/pending
      TTVDROPS_IMPORTED_DIR: /srv/ttvdrops/responses/imported
      TTVDROPS_BROKEN_DIR: /srv/ttvdrops/responses/broken
    profiles: [ monitoring ]
    volumes:
      - /mnt/Docker/Data/ttvdrops/app:/app/data/TTVDrops
      - /mnt/fourteen/Data/Responses:/srv/ttvdrops/responses
    command:
      - celery
      - -A
      - config
      - flower
      - --address=0.0.0.0
      - --port=5555
    ports:
      - "127.0.0.1:5555:5555"
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
